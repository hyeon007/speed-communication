name: Publish production containers

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/web/**
      - .github/workflows/publish-containers.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sp-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sp-${{ matrix.name }}:latest
